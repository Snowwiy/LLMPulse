[package]
name = "llm-pulse"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "llm-pulse"
path = "src/main.rs"

[dependencies]
tauri = { version = "2.12.1", features = [] }
dpi = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["json", "rustls"], default-features = false }
sysinfo = "0.33"
windows = { version = "0.52", features = ["Win32", "Win32_Foundation", "Win32_System", "Win32_System_LibraryLoader"] }

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }
